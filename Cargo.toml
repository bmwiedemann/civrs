[package]
name = "civrs"
version = "0.1.0"
edition = "2021"
description = "Rust reimplementation of MicroProse Civilization (DOS, 1991) using the original assets"

[dependencies]
sdl3 = { version = "0.20", features = ["unsafe_textures"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1
